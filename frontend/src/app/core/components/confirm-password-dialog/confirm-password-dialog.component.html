@if (srv.estado(); as s) {
  <div class="modal-overlay confirm-overlay" (click)="srv.cancelar()">
    <div class="modal-card confirm-card" (click)="$event.stopPropagation()">
      <div class="drawer-header">
        <h2>{{ s.titulo }}</h2>
        <button type="button" class="close" (click)="srv.cancelar()">&times;</button>
      </div>
      <p class="text-sm">{{ s.mensaje }}</p>
      <form (ngSubmit)="srv.enviar()">
        <div class="form-group mt-16">
          <label>Contraseña *</label>
          <input
            class="input"
            type="password"
            name="password"
            autofocus
            [ngModel]="s.password"
            (ngModelChange)="srv.actualizarPassword($event)"
          />
        </div>
        @if (s.error) {
          <div class="error-text mt-16">{{ s.error }}</div>
        }
        <div class="form-actions">
          <button type="submit" class="btn btn-danger" [disabled]="!s.password || s.enviando">
            {{ s.enviando ? 'Procesando...' : s.textoAceptar }}
          </button>
          <button type="button" class="btn btn-outline" (click)="srv.cancelar()">{{ s.textoCancelar }}</button>
        </div>
      </form>
    </div>
  </div>
}
